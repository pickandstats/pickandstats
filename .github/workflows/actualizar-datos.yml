name: Actualizar datos FEB

on:
  schedule:
    # Lunes a las 07:00 UTC (08:00/09:00 en España según horario)
    - cron: '0 7 * * 1'
  workflow_dispatch:   # y botón manual para lanzarlo cuando quieras

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm ci

      # Canario de transicion de temporada (ARQUITECTURA.md S17.2). Falla el
      # workflow si la temporada nueva YA TIENE PARTIDOS JUGADOS y la FEB aun
      # selecciona la anterior: sin esto, el pipeline scrapearia y publicaria una
      # temporada cerrada como si fuera la vigente, en silencio. Una discrepancia
      # sin partidos aun (pretemporada) NO falla, solo informa. SIN
      # continue-on-error a proposito, y el PRIMERO: si salta, no queremos que el
      # resto del job reescriba estado.json con un "actualizado hoy" falso.
      - name: Comprobar transicion de temporada
        run: node scraper/comprobar-temporada.js

      # Cache de las actas por cuartos (data/raw/.../actas). Persisten entre
      # ejecuciones para no re-extraer toda la temporada cada semana: solo se
      # descargan las actas de partidos nuevos. La clave rota por ejecucion con
      # fallback a la mas reciente (restore-keys).
      - name: Restaurar cache de actas
        uses: actions/cache@v4
        with:
          path: data/raw/*/*/actas
          key: actas-${{ github.run_id }}
          restore-keys: |
            actas-

      # ----- Tercera FEB (competición 3, por defecto) -----
      - name: Tercera · scrapear
        run: node scraper/scrape.js --competicion 3
      - name: Tercera · calcular
        run: node scraper/calcular.js --competicion 3 --temporada $(node -p "require('./data/processed/estado.json').competiciones.tercerafeb.temporada")
      - name: Tercera · histórico
        run: node scraper/historico.js --competicion 3
      - name: Tercera · fases (jugadores)
        run: node scraper/calcular-fases-jugadores.js --competicion 3 --temporada $(node -p "require('./data/processed/estado.json').competiciones.tercerafeb.temporada")

      # ----- Segunda FEB (competición 2) -----
      - name: Segunda · scrapear
        run: node scraper/scrape.js --competicion 2
      - name: Segunda · calcular
        run: node scraper/calcular.js --competicion 2 --temporada $(node -p "require('./data/processed/estado.json').competiciones.segundafeb.temporada")
      - name: Segunda · histórico
        run: node scraper/historico.js --competicion 2
      - name: Segunda · fases (jugadores)
        run: node scraper/calcular-fases-jugadores.js --competicion 2 --temporada $(node -p "require('./data/processed/estado.json').competiciones.segundafeb.temporada")

      # ----- Primera FEB (competición 1) -----
      - name: Primera · scrapear
        run: node scraper/scrape.js --competicion 1
      - name: Primera · calcular
        run: node scraper/calcular.js --competicion 1 --temporada $(node -p "require('./data/processed/estado.json').competiciones.primerafeb.temporada")
      - name: Primera · histórico
        run: node scraper/historico.js --competicion 1
      - name: Primera · fases (jugadores)
        run: node scraper/calcular-fases-jugadores.js --competicion 1 --temporada $(node -p "require('./data/processed/estado.json').competiciones.primerafeb.temporada")

      # ----- Análisis por cuartos (las tres categorías) -----
      # Usa la cache de actas: actas-cuartos solo extrae las de partidos nuevos.
      # continue-on-error para que un fallo aquí (cache expirada, PDF caído) no
      # tumbe la actualización del resto de datos.
      - name: Cuartos · Tercera
        continue-on-error: true
        run: |
          T=$(node -p "require('./data/processed/estado.json').competiciones.tercerafeb.temporada")
          node scraper/actas-cuartos.js --competicion 3 --temporada $T
          node scraper/verificar-cuartos.js --competicion 3 --temporada $T && \
          node scraper/calcular-cuartos.js --competicion 3 --temporada $T && \
          node scraper/boxscore-cuartos.js --competicion 3 --temporada $T
      - name: Cuartos · Segunda
        continue-on-error: true
        run: |
          T=$(node -p "require('./data/processed/estado.json').competiciones.segundafeb.temporada")
          node scraper/actas-cuartos.js --competicion 2 --temporada $T
          node scraper/verificar-cuartos.js --competicion 2 --temporada $T && \
          node scraper/calcular-cuartos.js --competicion 2 --temporada $T && \
          node scraper/boxscore-cuartos.js --competicion 2 --temporada $T
      - name: Cuartos · Primera
        continue-on-error: true
        run: |
          T=$(node -p "require('./data/processed/estado.json').competiciones.primerafeb.temporada")
          node scraper/actas-cuartos.js --competicion 1 --temporada $T
          node scraper/verificar-cuartos.js --competicion 1 --temporada $T && \
          node scraper/calcular-cuartos.js --competicion 1 --temporada $T && \
          node scraper/boxscore-cuartos.js --competicion 1 --temporada $T

      # Refresca el calendario de la temporada próxima (pretemporada/arranque):
      # scrapea sus índices y regenera calendario.json si la FEB cambió algo.
      - name: Refrescar calendario de la temporada próxima
        run: node scraper/refrescar-calendario.js
        continue-on-error: true

      # Si un cambio en el cálculo altera las temporadas cerradas, mejor enterarse aquí
      # que semanas después. No detiene el commit: los datos nuevos son válidos igual.
      - name: Comprobar que las temporadas cerradas no han cambiado
        run: node test/regresion.cjs
        continue-on-error: true

      - name: Commit y push si hay cambios
        run: |
          git config user.name "pickandstats-bot"
          git config user.email "actions@github.com"
          git add data/ web/public/data/*/*/equipos-cuartos.json web/public/data/*/*/jugadores-cuartos.json web/public/data/*/*/partidos-contexto.json web/public/data/*/*/boxscore-cuartos
          if git diff --staged --quiet; then
            echo "Sin partidos nuevos esta semana."
          else
            git commit -m "Actualización automática de datos ($(date +%d/%m/%Y))"
            git push
          fi
