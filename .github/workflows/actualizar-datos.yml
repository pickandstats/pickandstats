name: Actualizar datos FEB

on:
  schedule:
    # Domingo 22:41 UTC (23:41/00:41 en España, ya acabada la jornada). Antes:
    # lunes 07:00. Dos razones, medidas el 02/11 sobre los 16 runs `schedule` que
    # hay (ver ARQUITECTURA.md S17.17): (1) el minuto 0 y las 07:00 en punto no
    # son los más congestionados que parecía -- el vigilante, a las 09:23, llega
    # igual de tarde (3,5-7,6 h) --, pero la hora SÍ pesa: el hueco de las 00:00
    # UTC arranca con 2,5 h de mediana (máx. 4,2), el de las 06:00 con 4,7 h, y
    # el run del lunes a las 07:00 tenía 7,5 h de mediana y 9h55m de récord (la
    # extrapolación a las 22:41 es una HIPÓTESIS: se comprobará con los runs
    # que vengan; si no mejora, se vuelve a medir antes de tocar nada más);
    # (2) el lunes a las 17:17 se publicaba lo del sábado -- así llega el domingo
    # por la noche en vez de la tarde siguiente. Mismo número de runs, misma
    # carga contra la FEB: solo cambia CUÁNDO.
    - cron: '41 22 * * 0'
  workflow_dispatch:   # y botón manual para lanzarlo cuando quieras
    inputs:
      restaurar_desde_release:
        description: 'Forzar la restauración de actas desde el release (para verificar el respaldo, aunque la cache tenga actas)'
        type: boolean
        default: false
      # --reextraer, no --forzar (31/10, S17.16): lleva un arreglo de esquema
      # (un campo que difJug no copiaba) al ORIGEN -- data/raw/.../actas, no
      # solo al fichero servido -- para una lista concreta de ids, sin
      # reextraer la temporada entera. Vacio por defecto: una ejecucion
      # normal (cron o dispatch sin rellenar esto) no se ve afectada.
      reextraer_primera:
        description: 'IDs (separados por coma) a reextraer en Primera aunque su acta ya este sana -- vacio en runs normales'
        type: string
        default: ''
      reextraer_segunda:
        description: 'Igual que el anterior, para Segunda'
        type: string
        default: ''
      reextraer_tercera:
        description: 'Igual que el anterior, para Tercera'
        type: string
        default: ''

permissions:
  contents: write
  actions: write   # para `gh workflow run desplegar.yml` (ver el paso "Lanzar el despliegue")

# Pieza 1 contra la carrera de push (S17.4): serializa las ejecuciones de ESTE
# workflow entre si. Un dispatch manual que solape con el cron espera su turno en
# vez de correr en paralelo y chocar en el push. cancel-in-progress: false a
# proposito: un dispatch NO debe matar un cron en curso, debe encolarse.
concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm ci

      # Contador de peticiones HTTP (2.3 del 02/11): cada `node` de los pasos
      # siguientes anade una linea a PETICIONES_LOG al salir; el paso final
      # "Peticiones a la FEB" las suma. Va DESPUES del checkout y del `npm ci` a
      # proposito: una precarga que apunta a un fichero del repo rompe el propio
      # checkout si se pone a nivel de job. El script es inocuo si falla.
      - name: Activar el contador de peticiones
        run: |
          echo "PETICIONES_LOG=/tmp/peticiones.jsonl" >> "$GITHUB_ENV"
          echo "NODE_OPTIONS=--require $GITHUB_WORKSPACE/scraper/contar-peticiones.js" >> "$GITHUB_ENV"

      # Canario de transicion de temporada (ARQUITECTURA.md S17.2). Falla el
      # workflow si la temporada nueva YA TIENE PARTIDOS JUGADOS y la FEB aun
      # selecciona la anterior: sin esto, el pipeline scrapearia y publicaria una
      # temporada cerrada como si fuera la vigente, en silencio. Una discrepancia
      # sin partidos aun (pretemporada) NO falla, solo informa. SIN
      # continue-on-error a proposito, y el PRIMERO: si salta, no queremos que el
      # resto del job reescriba estado.json con un "actualizado hoy" falso.
      - name: Comprobar transicion de temporada
        run: node scraper/comprobar-temporada.js

      # Cache de las actas por cuartos (data/raw/.../actas). Persisten entre
      # ejecuciones para no re-extraer toda la temporada cada semana: solo se
      # descargan las actas de partidos nuevos. La clave rota por ejecucion con
      # fallback a la mas reciente (restore-keys).
      - name: Restaurar cache de actas
        uses: actions/cache@v4
        with:
          path: data/raw/*/*/actas
          key: actas-${{ github.run_id }}
          restore-keys: |
            actas-

      # Respaldo persistente (ARQUITECTURA.md S17.4). La cache de arriba es el
      # camino rapido pero caduca a los 7 dias; este paso restaura del release las
      # actas de la temporada seleccionada si la cache no las trajo. Orden
      # cache -> release -> FEB, con una linea de log inequivoca (ACTAS: ...) para
      # ver si un lunes cayo al camino lento (FEB = horas). Tolerante: si el release
      # falla, se cae a re-extraer de la FEB, que es el comportamiento sin respaldo.
      - name: Asegurar actas (cache -> release -> FEB)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.inputs.restaurar_desde_release }}" = "true" ]; then
            bash scraper/actas-release.sh restaurar --forzar
          else
            bash scraper/actas-release.sh restaurar
          fi

      # ----- Tercera FEB (competición 3, por defecto) -----
      - name: Tercera · scrapear
        run: node scraper/scrape.js --competicion 3
      - name: Tercera · calcular
        run: node scraper/calcular.js --competicion 3 --temporada $(node -p "require('./data/processed/estado.json').competiciones.tercerafeb.temporada")
      - name: Tercera · histórico
        run: node scraper/historico.js --competicion 3
      - name: Tercera · fases (jugadores)
        run: node scraper/calcular-fases-jugadores.js --competicion 3 --temporada $(node -p "require('./data/processed/estado.json').competiciones.tercerafeb.temporada")

      # ----- Segunda FEB (competición 2) -----
      - name: Segunda · scrapear
        run: node scraper/scrape.js --competicion 2
      - name: Segunda · calcular
        run: node scraper/calcular.js --competicion 2 --temporada $(node -p "require('./data/processed/estado.json').competiciones.segundafeb.temporada")
      - name: Segunda · histórico
        run: node scraper/historico.js --competicion 2
      - name: Segunda · fases (jugadores)
        run: node scraper/calcular-fases-jugadores.js --competicion 2 --temporada $(node -p "require('./data/processed/estado.json').competiciones.segundafeb.temporada")

      # ----- Primera FEB (competición 1) -----
      - name: Primera · scrapear
        run: node scraper/scrape.js --competicion 1
      - name: Primera · calcular
        run: node scraper/calcular.js --competicion 1 --temporada $(node -p "require('./data/processed/estado.json').competiciones.primerafeb.temporada")
      - name: Primera · histórico
        run: node scraper/historico.js --competicion 1
      - name: Primera · fases (jugadores)
        run: node scraper/calcular-fases-jugadores.js --competicion 1 --temporada $(node -p "require('./data/processed/estado.json').competiciones.primerafeb.temporada")

      # ----- Análisis por cuartos (las tres categorías) -----
      # Usa la cache de actas: actas-cuartos solo extrae las de partidos nuevos.
      # continue-on-error para que un fallo aquí (cache expirada, PDF caído) no
      # tumbe la actualización del resto de datos.
      - name: Cuartos · Tercera
        continue-on-error: true
        env:
          REEXTRAER: ${{ github.event.inputs.reextraer_tercera }}
        run: |
          T=$(node -p "require('./data/processed/estado.json').competiciones.tercerafeb.temporada")
          node scraper/actas-cuartos.js --competicion 3 --temporada $T ${REEXTRAER:+--reextraer "$REEXTRAER"}
          node scraper/verificar-cuartos.js --competicion 3 --temporada $T && \
          node scraper/calcular-cuartos.js --competicion 3 --temporada $T && \
          node scraper/boxscore-cuartos.js --competicion 3 --temporada $T
      - name: Cuartos · Segunda
        continue-on-error: true
        env:
          REEXTRAER: ${{ github.event.inputs.reextraer_segunda }}
        run: |
          T=$(node -p "require('./data/processed/estado.json').competiciones.segundafeb.temporada")
          node scraper/actas-cuartos.js --competicion 2 --temporada $T ${REEXTRAER:+--reextraer "$REEXTRAER"}
          node scraper/verificar-cuartos.js --competicion 2 --temporada $T && \
          node scraper/calcular-cuartos.js --competicion 2 --temporada $T && \
          node scraper/boxscore-cuartos.js --competicion 2 --temporada $T
      - name: Cuartos · Primera
        continue-on-error: true
        env:
          REEXTRAER: ${{ github.event.inputs.reextraer_primera }}
        run: |
          T=$(node -p "require('./data/processed/estado.json').competiciones.primerafeb.temporada")
          node scraper/actas-cuartos.js --competicion 1 --temporada $T ${REEXTRAER:+--reextraer "$REEXTRAER"}
          node scraper/verificar-cuartos.js --competicion 1 --temporada $T && \
          node scraper/calcular-cuartos.js --competicion 1 --temporada $T && \
          node scraper/boxscore-cuartos.js --competicion 1 --temporada $T

      # Sube al release las actas de la temporada en curso (ARQUITECTURA.md S17.4),
      # el respaldo persistente del que restaura el paso "Asegurar actas". Crea el
      # release si no existe (bootstrap en la 1a ejecucion). Siempre sube la
      # temporada en curso (sin manifest: la cache es todo-o-nada, el disco ya es la
      # fuente de verdad). Tolerante: un fallo de subida no tumba la actualizacion.
      - name: Publicar actas al release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scraper/actas-release.sh publicar

      # Refresca el calendario de la temporada próxima (pretemporada/arranque):
      # scrapea sus índices y regenera calendario.json si la FEB cambió algo.
      - name: Refrescar calendario de la temporada próxima
        run: node scraper/refrescar-calendario.js
        continue-on-error: true

      # Si un cambio en el cálculo altera las temporadas cerradas, mejor enterarse aquí
      # que semanas después. No detiene el commit: los datos nuevos son válidos igual.
      - name: Comprobar que las temporadas cerradas no han cambiado
        run: node test/regresion.cjs
        continue-on-error: true

      - name: Commit y push si hay cambios
        run: |
          git config user.name "pickandstats-bot"
          git config user.email "actions@github.com"
          git add data/   # los cuartos ya viven en data/processed (S17.4), cubiertos por esto
          if git diff --staged --quiet; then
            echo "Nada que commitear."
          else
            # Distinguir semana con datos de semana en blanco. estado.json reescribe
            # sus timestamps (y calendarios) en cada ejecucion, asi que git nunca lo
            # ve "vacio" y el commit salia siempre igual (S17.4). Si lo UNICO que
            # cambio es estado.json, no hubo datos nuevos: se refleja en el mensaje
            # para distinguirlo de un vistazo en el historial. estado.json se
            # commitea igual —la app usa estado.actualizado para la fecha de datos y
            # resumen-salud lee estado.calendarios para la frescura de indices—.
            if git diff --staged --name-only | grep -v '^data/processed/estado\.json$' | grep -q .; then
              git commit -m "Actualización automática de datos ($(date +%d/%m/%Y))"
            else
              git commit -m "Sin datos nuevos, solo estado ($(date +%d/%m/%Y))"
            fi
            # Pieza 2 contra la carrera de push (S17.4): el concurrency de arriba
            # serializa ESTE workflow, pero un push manual a main mientras corre el
            # job (Alexandre empuja a menudo) produce el mismo rechazo. Si el push
            # es rechazado, rebasar sobre origin/main y reintentar: bot (datos) y
            # humano (docs/scripts) casi nunca tocan los mismos ficheros, asi que
            # el rebase se resuelve solo. Un conflicto REAL en datos deja el rebase
            # a medias y sale con codigo 1 -> falla ruidosamente para que se mire.
            pushed=0
            for intento in 1 2 3; do
              if git push; then pushed=1; break; fi
              echo "push rechazado (intento $intento); rebase sobre origin/main y reintento"
              git pull --rebase origin main || { echo "CONFLICTO en el rebase: requiere intervencion manual"; exit 1; }
            done
            [ "$pushed" = 1 ] || { echo "push fallo tras 3 intentos"; exit 1; }
          fi

      # Despliegue acoplado al run de datos (02/11, 2.1). Un push hecho con el
      # GITHUB_TOKEN por defecto NO dispara workflows -- salvo `workflow_dispatch`
      # y `repository_dispatch`, que es la excepcion documentada --, asi que el
      # commit del bot de arriba no lanzaba desplegar.yml y el lector esperaba al
      # siguiente tic del cron (hasta 6h; el 02/11, el sitio siguio sirviendo los
      # datos del 31/10 hasta que un push humano arrastro el despliegue). Ahora el
      # propio run lo lanza. Va ANTES del resumen de salud a proposito: ese paso
      # es una alarma y sale con 1 si hay criticos, y una alarma no debe retener
      # la publicacion de datos ya commiteados (misma razon por la que el resumen
      # va despues del commit). Lanza el despliegue de `main`, que ya incluye el
      # commit del bot.
      - name: Lanzar el despliegue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run desplegar.yml --ref "${{ github.ref_name }}"

      # Resumen de salud (ARQUITECTURA.md S17.5.4). EL ULTIMO y SIN
      # continue-on-error: es una alarma, no un guardian. Los datos ya se
      # commitearon; si algo critico esta mal (cuartos bloqueados, un grupo sin
      # partidos, indices de la temporada maxima obsoletos => canario ciego) el
      # workflow se pone rojo para que una persona lo mire, sin haber retenido
      # datos validos. Los bloques de cuartos siguen tolerantes; aqui se juzga.
      #
      # Hace su PROPIO commit aparte (bugfix 15/10, ver cabecera de
      # scraper/resumen-salud.js): la base de comparacion de cuartos-cobertura.json
      # se escribe aqui, DESPUES del "Commit y push" de arriba a proposito -- asi
      # que sin este segundo commit esa escritura nunca llegaba al repo y la base
      # quedaba fosilizada para siempre. No muevas este paso antes del commit
      # principal para "arreglarlo" de otra forma: eso convertiria la alarma en
      # guardian, que es justo lo que el diseño de arriba evita.
      - name: Resumen de salud del pipeline
        run: node scraper/resumen-salud.js

      # Peticiones HTTP de esta ejecucion (contador de arriba). `always()` para
      # que se vea tambien cuando el resumen de salud ha puesto el job en rojo.
      - name: Peticiones a la FEB
        if: always()
        continue-on-error: true
        run: node scraper/resumen-peticiones.js
