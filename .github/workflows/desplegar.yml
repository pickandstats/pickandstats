name: Desplegar web en GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Red de seguridad, no camino principal (02/11): el propio run de datos lo
    # lanza (`gh workflow run`, ver actualizar-datos.yml) y los push lo disparan. Antes iba cada 6 h porque era el UNICO camino de los datos del
    # bot; 100 ticks medidos, mediana de 5,5 h entre uno y otro y un hueco de
    # 11 h el 02/11. Diario y fuera del minuto 0. Si el lanzamiento de arriba
    # falla, el vigilante (12 h de publicacion pendiente) lo ve antes que este.
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Guardian de la cinta de navegación: site/src/layouts/Base.astro y
      # web/src/CintaNav.jsx se mantienen idénticas a mano (mismos enlaces,
      # mismo orden), y el único aviso que lo protegía era un comentario —
      # así que la app se quedó una semana entera sin el enlace de
      # Observatorio sin que nada avisara. Va ANTES de construir, y bloquea
      # a propósito: el arreglo siempre es de una línea.
      - name: Verificar que la cinta del sitio y de la app coinciden
        run: node test/verificar-cinta.cjs

      # ---- Sitio de contenido (Astro) -> raíz del dominio ----
      - name: Astro · instalar
        working-directory: site
        run: npm ci
      - name: Astro · compilar
        working-directory: site
        run: npm run build

      # ---- App de estadísticas (React) -> /app ----
      - name: App · instalar
        working-directory: web
        run: npm ci
      - name: Copiar datos procesados
        run: |
          mkdir -p web/public/data
          cp -r data/processed/. web/public/data/
      - name: App · compilar
        working-directory: web
        run: npm run build

      # Guardian de despliegue (ARQUITECTURA.md S17.4): el build que se va a
      # publicar debe llevar los ficheros de cuartos de la temporada en curso. Va
      # DESPUES del build y ANTES de publicar: si faltan, falla aqui y el sitio se
      # queda en la version anterior (correcta) en vez de publicar una sin cuartos.
      # Mira web/dist, que es el mismo antes y despues de mover los cuartos a
      # data/processed, asi que el instrumento no se mueve con el cambio que vigila.
      - name: Verificar que el build lleva los cuartos
        run: node scraper/verificar-cuartos-desplegados.js

      # ---- Ensamblar la salida final ----
      - name: Ensamblar
        run: |
          rm -rf _publish
          mkdir -p _publish/app
          cp -r site/dist/. _publish/
          cp -r web/dist/. _publish/app/
          echo "--- raíz ---"
          ls _publish
          echo "--- /app ---"
          ls _publish/app
          if [ -f _publish/CNAME ]; then
            echo "CNAME correcto: $(cat _publish/CNAME)"
          else
            echo "ERROR: falta el CNAME en la raíz, se perdería el dominio"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
