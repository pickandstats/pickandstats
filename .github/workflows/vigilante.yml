name: Vigilante del pipeline de datos

# Corre en su PROPIO workflow, independiente de actualizar-datos.yml. El resumen
# de salud (S17.5.4) vigila DESDE DENTRO de ese job: si GitHub descarta la
# ejecucion programada bajo carga (ocurre, esta documentado), no hay job, no hay
# alarma. Este workflow solo lee el latido que el pipeline ya escribe en cada
# ejecucion con exito (data/processed/estado.json, campo `actualizado`) — no
# reconstruye nada, solo vigila que siga avanzando. Logica completa y comentada
# en scraper/vigilante.js.
#
# IMPORTANTE, para quien toque esto despues: el latido mide "la ultima vez que
# el pipeline miro", NO "la ultima vez que cambiaron los datos". El pipeline
# corre los 12 meses del año, tambien en pretemporada y fuera de temporada, asi
# que un latido viejo siempre significa lo mismo (la ejecucion no ocurrio),
# independientemente de si habia partidos que procesar esa semana. Si esto se
# "mejora" para que compruebe si cambiaron los datos, aparecen falsos positivos
# en cada semana en blanco.
#
# Limite conocido, dejado escrito a proposito: este workflow es TAMBIEN
# programado, y GitHub puede descartarlo igual que al de datos (ocurre, esta
# documentado). Diario hace improbable perder la ejecucion de un dia Y la del
# siguiente, no imposible. Lo unico que elimina el riesgo del todo es un
# dead-man's switch externo — un tercero que espera un ping y avisa si no llega.
# No se monta aqui a proposito: mete una dependencia externa y un secreto en un
# proyecto de una persona. Queda como via de mejora si el riesgo residual deja
# de ser aceptable.
#
# Diario, no dos veces por semana (S17.10): el job tarda segundos y solo habla
# cuando hay algo que decir, asi que correr mas a menudo no añade ruido -- baja
# el peor caso de deteccion de tres dias y medio a uno. Es ademas el paso previo
# a apagar el correo de ejecucion de Actions como canal aparte: veinte avisos
# identicos de ese correo (uno por despliegue fallido cada 6h) sepultaron las dos
# issues que de verdad decian algo, el 5/10. Este workflow pasa a ser el unico
# canal cuando cubra lo que ese correo veia y el latido no (la comprobacion de
# abajo, sobre la conclusion del ultimo despliegue) -- hasta entonces, los dos
# canales siguen activos a la vez.
on:
  schedule:
    # Las 09:23 UTC todos los dias: fuera del minuto 0 y de la hora 07:00 del
    # cron de datos, para no compartir ni el minuto ni el instante de carga de
    # GitHub con el.
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      simular_retraso:
        description: 'Dias a restar al latido, SOLO para probar la alarma de punta a punta (no usar en produccion)'
        type: number
        default: 0

permissions:
  contents: read
  issues: write   # para abrir/actualizar/cerrar la issue de alarma
  actions: read   # para leer la conclusion del ultimo despliegue completado

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Comprobar el latido de estado.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scraper/vigilante.js --simular-retraso "${{ github.event.inputs.simular_retraso || 0 }}"
